name: Supabase Keep Alive

on:
  schedule:
    # Runs every 2 days at 04:00 UTC to ensure Supabase never pauses (limit is 7 days)
    - cron: '0 4 */2 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SnapBio Supabase Database & Web
        run: |
          echo "Pinging SnapBio Supabase REST API..."
          curl -s -o /dev/null -w "HTTP_STATUS:%{http_code}\n" \
            -H "apikey: sb_publishable_HmYErlaENCD66moywDrCeg_ywLYoY__" \
            -H "Authorization: Bearer sb_publishable_HmYErlaENCD66moywDrCeg_ywLYoY__" \
            "https://uegklsvwjplsjbupafwl.supabase.co/rest/v1/"
          
          echo "Pinging SnapBio Live Site..."
          curl -s -o /dev/null -w "LIVE_SITE_STATUS:%{http_code}\n" \
            "https://snapbio.puretoolhub.com"
          
          echo "Keep-alive ping completed successfully."
